<!-- Pass data from parent component Home to child component Greeting -->
<!-- [message] with sq brackets means the value inside "" on the RHS is a javascript expression
   as compared to writing message = "Hello World" -->
<app-greeting [message]="homeMessage()"/> 
<app-counter />
<!-- Call keyUpHandler event handler method on keyup event type inside text box -->
<input placeholder="Type something..." type="text" (keyup)="keyUpHandler($event)">
